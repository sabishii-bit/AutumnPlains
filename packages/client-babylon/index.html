<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autumn Plains - Babylon.js</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100vh;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
    // Polyfills for simple-peer (requires global and process objects)
    window.global = window;
    window.process = {
      env: { NODE_ENV: 'production' },
      nextTick: function(fn) { setTimeout(fn, 0); }
    };
  </script>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
